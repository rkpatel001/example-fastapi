name : Build and Deploy Code

on: [push,pull_request]
  
jobs: 
  job1: 
    environment:
      name: testing  # name that we define in github
    env: #env for envionment variable
      DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}


    services:     #postgres set-up
      postgres:
        image: postgres
        env:  #env for database 
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          POSTGRES_DB: ${{secrets.DATABASE_NAME}}_test
        ports:
        - 5432:5432
        # copy form documenation
        options: >-
         --health-cmd pg_isready
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5


    runs-on: ubuntu-latest
    steps: 
      - name: pulling git repo
        uses: actions/checkout@v2
      - name: Install python version 3.12
        uses: actions/setup-python@v2
        with: 
          python-version: "3.12"
      - name: update pip
        run:  python -m pip install --upgrade pip
      - name: install all dependencies
        run: pip install -r requirements.txt
      - name: test with pytest
        run: |
          pip install pytest
          pytest

      # Docker 
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}} #gnerated from docker personal access token
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}} #generated from docker personal access token

      # Copy from docker-github Docs
      - name : Set up Docker Buildx
        id : buildx
        users : dicker/setup-buildx-action@v1 


      - name : Build and push
        id : docker_build
        uses : docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{steps.buildx.outputs.name}}
          push: true
          tags : ${{secrets.DOCKER_HUB_USERNAME}}/myfastapi:latest
          cache-form: type=local,dest=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name : Image digest
        run : echo ${{steps.docker_build.outputs.digest}}

 